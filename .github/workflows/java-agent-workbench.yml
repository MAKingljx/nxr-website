name: Java Partner Submissions

on:
  push:
    branches: [main, 'Phoenix/**']
    paths:
      - nxr_platform/nxr-backend-ruoyi/**
      - nxr_platform/nxr-frontend-web/**
      - nxr_platform/nxr-frontend-admin-ruoyi/**
      - nxr_platform/nxr-frontend-shared/**
      - nxr_platform/nxr-scripts/verify-agent-workbench.py
      - nxr_platform/nxr-scripts/verify-partner-card-identities.py
      - nxr_platform/nxr-scripts/verify-partner-order-return.py
      - nxr_platform/nxr-scripts/verify-partner-order-exceptions.py
      - nxr_platform/nxr-scripts/prepare-agent-workbench-qa.py
      - nxr_platform/nxr-sql/ruoyi/**
      - nxr_platform/deploy/hot-deploy-java.sh
      - nxr_platform/deploy/build-java-release.sh
      - nxr_platform/deploy/tests/test_java_rollback_compatibility.py
      - .github/workflows/java-agent-workbench.yml
  pull_request:
    branches: [main, 'Phoenix/**']
    paths:
      - nxr_platform/nxr-backend-ruoyi/**
      - nxr_platform/nxr-frontend-web/**
      - nxr_platform/nxr-frontend-admin-ruoyi/**
      - nxr_platform/nxr-frontend-shared/**
      - nxr_platform/nxr-scripts/verify-agent-workbench.py
      - nxr_platform/nxr-scripts/verify-partner-card-identities.py
      - nxr_platform/nxr-scripts/verify-partner-order-return.py
      - nxr_platform/nxr-scripts/verify-partner-order-exceptions.py
      - nxr_platform/nxr-scripts/prepare-agent-workbench-qa.py
      - nxr_platform/nxr-sql/ruoyi/**
      - nxr_platform/deploy/hot-deploy-java.sh
      - nxr_platform/deploy/build-java-release.sh
      - nxr_platform/deploy/tests/test_java_rollback_compatibility.py
      - .github/workflows/java-agent-workbench.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: disposable-media-ci
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-media-ci --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Java compilation and isolated H2/MySQL media tests
        working-directory: nxr_platform/nxr-backend-ruoyi
        env:
          NXR_RUN_MEDIA_QUEUE_MYSQL: '1'
          NXR_MEDIA_QUEUE_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          NXR_MEDIA_QUEUE_MYSQL_USER: root
          NXR_MEDIA_QUEUE_MYSQL_PASSWORD: disposable-media-ci
        run: mvn -B -pl ruoyi-admin -am package
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            nxr_platform/nxr-frontend-web/package-lock.json
            nxr_platform/nxr-frontend-admin-ruoyi/package-lock.json
      - name: Customer portal build
        working-directory: nxr_platform/nxr-frontend-web
        run: npm ci && node --test tests/*.test.mjs && npm run build
      - name: Agent admin build
        working-directory: nxr_platform/nxr-frontend-admin-ruoyi
        run: npm ci && node --test tests/*.test.js && npm run build:prod
      - name: Acceptance helper syntax
        run: python3 -m py_compile nxr_platform/nxr-scripts/verify-agent-workbench.py nxr_platform/nxr-scripts/verify-partner-card-identities.py nxr_platform/nxr-scripts/verify-partner-order-return.py nxr_platform/nxr-scripts/verify-partner-order-exceptions.py nxr_platform/nxr-scripts/prepare-agent-workbench-qa.py
      - name: Legacy rollback data boundary
        run: python3 -m unittest discover -s nxr_platform/deploy/tests -p test_java_rollback_compatibility.py
