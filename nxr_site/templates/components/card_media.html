<div class="card-media">
  <figure class="img-wrap img-wrap--front">
    <img src="{{ card.front_image }}" alt="{{ card.card_name }} front" data-fallback="placeholder" loading="eager">
    <figcaption class="img-label">Front</figcaption>
  </figure>
  <figure class="img-wrap img-wrap--back">
    <img src="{{ card.back_image }}" alt="{{ card.card_name }} back" data-fallback="placeholder" loading="lazy">
    <figcaption class="img-label">Back</figcaption>
  </figure>
</div>
