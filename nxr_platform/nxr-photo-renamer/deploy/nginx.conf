# Managed only by nxr-photo-renamer/deploy/publish.py.
location = /tools/photo-renamer {
    return 308 /tools/photo-renamer/;
}

location ^~ /tools/photo-renamer/ {
    alias /var/www/nxr-photo-renamer/current/;
    index index.html;
    autoindex off;

    limit_except GET {
        deny all;
    }

    add_header Cache-Control "no-store, no-transform" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
}
