# Include this file inside the existing nxrgrading.com TLS server block.
location = /java-stage {
    return 308 /java-stage/;
}

location ^~ /java-stage/ {
    proxy_pass http://127.0.0.1:18082/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /java-stage;
    proxy_read_timeout 300;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location = /java-stage-admin {
    return 308 /java-stage-admin/;
}

location ^~ /java-stage-admin/ {
    proxy_pass http://127.0.0.1:18083/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /java-stage-admin;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    client_max_body_size 256M;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
