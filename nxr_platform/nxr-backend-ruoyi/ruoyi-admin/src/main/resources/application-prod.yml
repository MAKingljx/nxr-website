# Production-safe overrides. Start with SPRING_PROFILES_ACTIVE=druid,prod so
# the datasource profile loads first and these limits win last.
server:
  address: ${NXR_SERVER_ADDRESS:127.0.0.1}
  port: ${NXR_SERVER_PORT:18088}
  shutdown: graceful
  tomcat:
    accept-count: ${NXR_TOMCAT_ACCEPT_COUNT:50}
    threads:
      max: ${NXR_TOMCAT_MAX_THREADS:40}
      min-spare: ${NXR_TOMCAT_MIN_SPARE_THREADS:4}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  devtools:
    restart:
      enabled: false
  servlet:
    multipart:
      max-file-size: ${NXR_MAX_UPLOAD_FILE_SIZE:64MB}
      max-request-size: ${NXR_MAX_UPLOAD_REQUEST_SIZE:256MB}
  data:
    redis:
      host: ${NXR_REDIS_HOST:127.0.0.1}
      port: ${NXR_REDIS_PORT:6379}
      database: ${NXR_REDIS_DATABASE:12}
      password: ${NXR_REDIS_PASSWORD:}
      timeout: 5s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 4
          max-active: 4
          max-wait: 2s
  datasource:
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 8
      web-stat-filter:
        enabled: false
      stat-view-servlet:
        enabled: false

token:
  # Deliberately has no default. Production startup must fail if it is absent.
  secret: ${NXR_TOKEN_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.ruoyi: info
    org.springframework: warn
