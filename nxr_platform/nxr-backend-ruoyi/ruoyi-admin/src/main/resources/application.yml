# 项目相关配置
ruoyi:
  # 名称
  name: NXR
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${user.home}/nxr-ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# NXR 业务配置（键名与原 nxr-backend-java application.yml 保持一致）
nxr:
  cors:
    allowed-origins: ${NXR_CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001,https://nxrgrading.com}
  media:
    storage-root: ${NXR_MEDIA_STORAGE_ROOT:./.local-data/media}
    public-base-url: ${NXR_MEDIA_PUBLIC_BASE_URL:http://127.0.0.1:8088}
    local-bucket: ${NXR_MEDIA_LOCAL_BUCKET:local-media}
    import:
      max-files: ${NXR_MEDIA_IMPORT_MAX_FILES:1000}
      max-file-size-bytes: ${NXR_MEDIA_IMPORT_MAX_FILE_SIZE_BYTES:52428800}
  exports:
    storage-root: ${NXR_EXPORTS_STORAGE_ROOT:./.local-data/exports}
  public-site:
    base-url: ${NXR_PUBLIC_SITE_BASE_URL:http://127.0.0.1:3000}
  customer:
    session-days: ${NXR_CUSTOMER_SESSION_DAYS:30}
  payments:
    # No default is intentional. A real provider callback is rejected until a
    # deployment supplies NXR_PAYMENT_CALLBACK_TOKEN.
    callback-token: ${NXR_PAYMENT_CALLBACK_TOKEN:}
  email:
    from: ${NXR_EMAIL_FROM:}
    resend-key: ${NXR_RESEND_KEY:}
    smtp-host: ${NXR_SMTP_HOST:}
    smtp-port: ${NXR_SMTP_PORT:587}
    smtp-user: ${NXR_SMTP_USER:}
    smtp-password: ${NXR_SMTP_PASS:}
    smtp-starttls: ${NXR_SMTP_STARTTLS:true}
  ai:
    deepseek-key: ${DEEPSEEK_API_KEY:}
    deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    deepseek-model: ${DEEPSEEK_MODEL:deepseek-chat}

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8088
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
    # Do not fall back to the machine's locale; English is the admin default.
    fallback-to-system-locale: false
  profiles:
    active: druid
  # 文件上传（NXR 媒体导入需要大文件支持，与原后端保持 2GB 上限）
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 2GB
      # 设置总上传的文件大小
      max-request-size: 2GB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${NXR_TOKEN_SECRET:local-development-token-change-me}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
