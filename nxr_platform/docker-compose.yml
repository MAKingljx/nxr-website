services:
  nxr-mysql:
    image: mysql:8.4
    container_name: nxr-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NXR_MYSQL_ROOT_PASSWORD:?set NXR_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nxr_ruoyi
      MYSQL_USER: nxr
      MYSQL_PASSWORD: ${NXR_DB_PASSWORD:?set NXR_DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - nxr_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -unxr -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  nxr-redis:
    image: redis:7-alpine
    container_name: nxr-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nxr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nxr_mysql_data:
  nxr_redis_data:
